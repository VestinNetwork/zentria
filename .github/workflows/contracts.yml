name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"

jobs:
  foundry:
    name: build + test + fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test (v2 suite)
        run: forge test --match-path 'test/v2/**' -vv

      - name: Test (full)
        run: forge test -vv
